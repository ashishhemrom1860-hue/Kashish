name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o KashishAdvanced-v2.zip -d extracted
          cp -r extracted/*/. extracted/ 2>/dev/null || true
          find extracted -mindepth 1 -maxdepth 1 -type d -exec cp -r {}/* . \; 2>/dev/null || true
          find extracted -mindepth 1 -maxdepth 1 -type f -exec cp {} . \;
          rm -rf extracted
          rm -f KashishAdvanced-v2.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract Kashish Advanced project" || echo "Nothing to commit"
          git push
